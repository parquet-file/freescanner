name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (analyze · test · APK · AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter (pinned stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      # ------------------------------------------------------------------
      # Optional release signing: when the repo secrets exist the APK/AAB
      # are signed with the real upload key; otherwise they are debug-signed
      # (installable for testing, not uploadable to Google Play).
      # Secrets (Settings → Secrets and variables → Actions):
      #   ANDROID_KEYSTORE_BASE64    base64 of the .jks keystore file
      #   ANDROID_KEYSTORE_PASSWORD  keystore password
      #   ANDROID_KEY_ALIAS          key alias
      #   ANDROID_KEY_PASSWORD       key password
      # ------------------------------------------------------------------
      - name: Decode keystore (if configured)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            echo "file=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_OUTPUT"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Debug-signed build (no ANDROID_KEYSTORE_BASE64 secret)."
          fi

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Build release AAB (Play Store bundle)
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Checksums
        run: |
          cd build/app/outputs
          {
            echo '### SHA-256 checksums'
            echo '```'
            sha256sum flutter-apk/app-release.apk bundle/release/app-release.aab
            echo '```'
          > "$GITHUB_STEP_SUMMARY" || true
          sha256sum flutter-apk/app-release.apk bundle/release/app-release.aab > checksums.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: freescanner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: freescanner-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # ------------------------------------------------------------------
      # On a v* tag: publish a GitHub Release with the APK + AAB attached.
      # ------------------------------------------------------------------
      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd build/app/outputs
          {
            echo "FreeScanner ${TAG}"
            echo
            echo "**Artifacts**"
            echo "- \`FreeScanner-${TAG}.apk\` — install directly on any Android 7.0+ device"
            echo "- \`app-release.aab\` — upload to Google Play Console"
            echo
            if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
              echo "Signed with the configured upload keystore."
            else
              echo "> ⚠️ Debug-signed build (no signing secrets configured). Install for testing only — configure the ANDROID_KEYSTORE_* secrets before a Play Store upload."
            fi
            echo
            echo '**SHA-256**'
            echo '```'
            sha256sum flutter-apk/app-release.apk bundle/release/app-release.aab
            echo '```'
          } > release-notes.md
          cp flutter-apk/app-release.apk "FreeScanner-${TAG}.apk"
          cp bundle/release/app-release.aab "FreeScanner-${TAG}.aab"
          gh release create "${TAG}" \
            --title "FreeScanner ${TAG}" \
            --notes-file release-notes.md \
            "FreeScanner-${TAG}.apk" \
            "FreeScanner-${TAG}.aab"
