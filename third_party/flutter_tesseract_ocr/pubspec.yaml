name: flutter_tesseract_ocr
description: >-
  VENDORED copy of flutter_tesseract_ocr 0.4.31 (khjde1207/tesseract_ocr, MIT)
  for FreeScanner, with a Gradle 9 / AGP 9 compatible android/build.gradle —
  upstream declares jcenter() (removed in Gradle 9) and pins AGP 7.1.2 in its
  own buildscript. The Dart and Java sources are unchanged from upstream.
version: 0.4.31
homepage: https://github.com/khjde1207/tesseract_ocr

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=1.12.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  path: ^1.9.0

# For information on the generic Dart part of this file, see
# https://dart.dev/tools/pub/pubspec
flutter:
  plugin:
    platforms:
      android:
        package: io.paratoner.flutter_tesseract_ocr
        pluginClass: FlutterTesseractOcrPlugin
      ios:
        pluginClass: FlutterTesseractOcrPlugin
