org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# R8 shrinking is OFF for release builds.
#
# Flutter >= 3.47 enables R8 minification + resource shrinking on release
# builds BY DEFAULT (packages/flutter_tools/gradle FlutterPlugin.kt ->
# shouldShrinkResources(), reads the Gradle property "shrink", default true).
# With this app's plugin set the shrunk release build crashed immediately at
# launch (right after the splash screen) — R8 incorrectly stripping Flutter
# plugin classes is a known Flutter regression (flutter/flutter#154580).
# This property is the official opt-out; app/build.gradle.kts also sets
# isMinifyEnabled = false explicitly.
#
# To re-enable shrinking later: remove this line AND the explicit flags in
# app/build.gradle.kts, keep the rules in app/proguard-rules.pro complete,
# and test a release install on a real device before shipping.
shrink=false
